name: BTC-USDT 4H Walk-Forward v4 Paper Trading

on:
  schedule:
    - cron: '5 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-btc-v4-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy pandas requests
      - run: python strategy_btc_v4_paper.py
      - run: |
          git config user.name "btc-quant-v4-bot"
          git config user.email "bot@users.noreply.github.com"
          git add paper_state.json index.html
          git diff --staged --quiet || git commit -m "chore: update BTC v4 4H paper state"
          git push
